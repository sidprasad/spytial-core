name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - run: npm install

      - run: npm test -- --run --exclude tests/z3-equivalence.test.ts --exclude tests/language-manifest.test.ts

  # The spec language is a published contract (docs/spytial-language.json +
  # docs/spytial-spec.schema.json), so it gets its own job rather than riding
  # along with the functional suite: a red mark here means the language changed
  # or the manifest drifted from the parser, which is a different kind of
  # failure — and a different set of people to notify — than a broken feature.
  spec-language:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - run: npm install

      # Regenerate first: this fails loudly when the checked-in artifacts are
      # stale, instead of leaving consumers pinned to a manifest that no longer
      # describes the engine.
      - run: npm run build:language

      - run: npm run test:language

      - name: Check the published artifacts are committed
        run: git diff --exit-code -- docs/spytial-language.json docs/spytial-spec.schema.json

  solver-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check for relevant changes
        id: changes
        run: |
          BASE=${{ github.event.pull_request.base.sha || 'HEAD~1' }}
          if git diff --name-only "$BASE"...HEAD | grep -qE \
            'src/layout/.*constraint|tests/.*z3|tests/helpers/.*oracle|tests/helpers/.*constraint'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v5
        if: steps.changes.outputs.run == 'true'
        with:
          node-version: '20'

      - run: npm install
        if: steps.changes.outputs.run == 'true'

      # --bail=1: one confirmed validator/oracle discrepancy is enough signal;
      # everything after it (especially after a Z3 WASM abort) is noise.
      - run: npx vitest run --bail=1 tests/z3-equivalence.test.ts
        if: steps.changes.outputs.run == 'true'

      - name: Skip (no relevant changes)
        if: steps.changes.outputs.run != 'true'
        run: echo "Skipping solver-oracle — no changes to constraint validator, oracle, or Z3 tests."
