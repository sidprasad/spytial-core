name: Publish browser bundle to npm

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      # `contents: write` so the release that carries the spec-language
      # artifacts can be created from this same tag push.
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: npm install -g npm@latest
      - run: npm install
      - run: npm run clean
      - run: npm run build:all

      - run: npm publish --access public --provenance

      # Every release carries a machine-readable description of the spec
      # language, so an integration can pin the exact language its generated
      # specs target instead of scraping the Markdown reference.
      - name: Attach the spec-language artifacts to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LANGUAGE_VERSION=$(node -p "require('./docs/spytial-language.json').languageVersion")
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --notes "**Spec language \`${LANGUAGE_VERSION}\`** (the date it last changed) — attached: \`spytial-language.json\` (every constraint and directive, its fields, and what is deprecated) and \`spytial-spec.schema.json\` (JSON Schema for validating a spec). Same date as the last release means nothing you generate needs revisiting." \
            docs/spytial-language.json \
            docs/spytial-spec.schema.json
