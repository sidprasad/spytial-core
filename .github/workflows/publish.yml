name: Publish browser bundle to npm

on:
  push:
    tags:
      - 'v*.*.*'
  # Lets a release be published by hand when a tag push never reaches Actions —
  # during a GitHub incident, say, where the tag lands on the remote but no run
  # is ever created. Dispatch it against the release tag; both steps below check
  # for existing state first, so a rerun is harmless.
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      # `contents: write` so the release that carries the spec-language
      # artifacts can be created from this same tag push.
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: npm install -g npm@latest
      - run: npm install
      - run: npm run clean
      - run: npm run build:all

      # Both remaining steps are re-runnable. A failure in either used to strand
      # the job: npm rejects a version it already has, so a rerun to fix the
      # release would die before reaching it, and `gh release create` rejects a
      # tag that already has a release.
      - name: Publish to npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "spytial-core@${VERSION}" version >/dev/null 2>&1; then
            echo "spytial-core@${VERSION} is already published — skipping."
          else
            npm publish --access public --provenance
          fi

      # Every release carries a machine-readable description of the spec
      # language, so an integration can pin the exact language its generated
      # specs target instead of scraping the Markdown reference.
      - name: Attach the spec-language artifacts to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Derived from package.json, not from the triggering ref. On a tag
          # push the two agree, but a manual run can be dispatched from a
          # branch, where GITHUB_REF_NAME is the branch name and would cut a
          # release called "main".
          TAG="v$(node -p "require('./package.json').version")"
          LANGUAGE_VERSION=$(node -p "require('./docs/spytial-language.json').languageVersion")
          NOTES="**Spec language \`${LANGUAGE_VERSION}\`** (the date it last changed) — attached: \`spytial-language.json\` (every constraint and directive, its fields, and what is deprecated) and \`spytial-spec.schema.json\` (JSON Schema for validating a spec). Same date as the last release means nothing you generate needs revisiting."
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} exists — updating its assets."
            gh release upload "${TAG}" \
              docs/spytial-language.json \
              docs/spytial-spec.schema.json \
              --clobber
          else
            gh release create "${TAG}" \
              --title "${TAG}" \
              --generate-notes \
              --notes "${NOTES}" \
              docs/spytial-language.json \
              docs/spytial-spec.schema.json
          fi
